user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 与标准 combined 完全一致（用自定义名避免覆盖内置格式告警）：
    # Filebeat 原样收、后端按 combined 解析
    log_format guanlan '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log guanlan;

    sendfile on;
    keepalive_timeout 5;

    server {
        listen 80 default_server;
        server_name _;

        location = / {
            return 200 "guanlan nginx demo is running\n";
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 制造 5xx
        location = /error {
            return 502 "bad gateway from upstream\n";
        }

        # 制造 4xx
        location = /forbidden {
            return 403 "forbidden\n";
        }

        location /api/ {
            add_header Content-Type application/json;
            return 200 '{"code":0,"msg":"ok"}';
        }

        location /static/ {
            add_header Content-Type application/javascript;
            return 200 "// static asset\n";
        }
    }
}
